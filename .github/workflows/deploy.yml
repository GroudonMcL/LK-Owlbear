# Builds the extension, fetches the LegendKeeper page lists and publishes both
# to GitHub Pages. Run it from the Actions tab ("Run workflow") after adding
# pages in LegendKeeper, so they become searchable.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Fetch LegendKeeper page lists
        run: node scripts/build-lists.mjs dist/lk
        env:
          LK_API_KEY: ${{ secrets.LK_API_KEY }}
          LK_PROJECT_ID: ${{ vars.LK_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
